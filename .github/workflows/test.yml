name: Runtime tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-boot:
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot ${{ matrix.loader }} dedicated server
        run: .github/scripts/boot-server.sh :${{ matrix.loader }}:runServer ${{ matrix.loader }}/runs/server

  neoforge-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display + Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers imagemagick
      - name: Boot NeoForge client to the title screen
        run: xvfb-run -a -s "-screen 0 1280x720x24" .github/scripts/boot-client.sh :neoforge:runClient neoforge/runs/client neoforge-title.png
      - name: NeoForge client joins a dedicated server and sees damage numbers
        run: xvfb-run -a -s "-screen 0 1280x720x24" .github/scripts/neoforge-e2e.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-client
          path: |
            neoforge-*.png
            client-boot.log
            server.log
            client.log
          if-no-files-found: ignore

  fabric-client-gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display + Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers
      - name: Run client game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientGameTest --stacktrace --console=plain 2>&1 | tee clientgametest.log; exit ${PIPESTATUS[0]}
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-client-gametest
          path: |
            fabric/build/run/clientGameTest/screenshots
            fabric/build/run/clientGameTest/logs/latest.log
            clientgametest.log
          if-no-files-found: ignore
