name: Mod list screenshot
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers imagemagick xdotool
      - run: xvfb-run -a -s "-screen 0 1280x720x24" .github/scripts/modlist-shot.sh
      - if: always()
        run: |
          cd shots && git init -q -b ci-modlist && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm shots && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-modlist
