name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric and NeoForge jars
        run: ./gradlew build --stacktrace
      - name: Collect release jars
        run: |
          mkdir -p dist
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -la dist
          test "$(ls dist/*.jar | wc -l)" -eq 2
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: damage_tester-jars
          path: dist/*.jar
          if-no-files-found: error
