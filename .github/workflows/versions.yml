name: Check loader versions
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latest versions for this Minecraft version
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          meta() { curl -fsSL "$1" | grep -oP '(?<=<version>)[^<]+' ; }
          echo "minecraft=$MC"
          echo "current:"; grep -E '^(neoforge_version|neo_form_version|fabric_loader_version|fabric_version)=' gradle.properties
          echo "latest:"
          echo "neoforge=$(meta https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep "^$MC\." | sort -V | tail -1)"
          echo "neoform=$(meta https://maven.neoforged.net/releases/net/neoforged/neoform/maven-metadata.xml | grep "^$MC-" | sort -V | tail -1)"
          echo "fabric_loader=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')"
          echo "fabric_api=$(meta https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep "+$MC$" | sort -V | tail -1)"
          echo "loom=$(meta https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -v SNAPSHOT | sort -V | tail -1)"
          echo "moddevgradle=$(meta https://maven.neoforged.net/releases/net/neoforged/moddev-gradle/maven-metadata.xml | grep -vE 'beta|alpha' | sort -V | tail -1)"
